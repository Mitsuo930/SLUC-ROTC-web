<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Log In - SLUC ROTCU</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="center-page">

<div class="form-card">
  <img src="../assets/images/logo.png" alt="ROTC seal" class="brand-logo">
  <h2 style="text-align:center;">Welcome to DMMMSU ROTC Unit (Admin)</h2>
  <form id="loginForm">
    <div class="form-row"><label>Email/ID</label><input type="text" id="idOrEmail" required></div>
    <div class="form-row"><label>Password</label><input type="password" id="password" required></div>
    <div style="text-align:center;">
      <button type="submit" class="btn btn-gold">Log In</button>
    </div>
    <p id="msg" class="msg-box"></p>
  </form>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  try {
    const res = await API.loginAdmin(idOrEmail.value, password.value);
    Session.set(res.admin, "admin");
    window.location.href = "home.html";
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "msg-box msg-error";
  }
});
</script>
</body>
</html>
