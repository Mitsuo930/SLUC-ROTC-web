<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance - SLUC ROTCU</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="../assets/images/logo.png" alt="logo">
    <h1>DMMMSU SLUC ROTC UNIT</h1>
  </div>
  <div class="actions"><div class="avatar">&#128100;</div></div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav>
      <a href="home.html">&#127968; HOME</a>
      <a href="attendance.html" class="active">&#128197; ATTENDANCE</a>
      <a href="profile.html">&#128100; PROFILE</a>
      <a href="about.html">&#8505; ABOUT US</a>
      <a href="#" id="logoutLink">&#8630; LOG OUT</a>
    </nav>
    <footer>&copy; JUHAIR D. MORAD<br>BSCS STUDENT</footer>
  </aside>

  <main class="content">
    <h2>ATTENDANCE PAGE</h2>

    <div class="panel">
      <h3>CREATE TRAINING DAY</h3>
      <div class="form-row"><label>Date</label><input type="date" id="dateIn"></div>
      <button class="btn btn-gold" id="genInBtn">CREATE QR CODE</button>
      <div id="qrIn" style="margin-top:16px;"></div>
    </div>

    <div class="panel">
      <h3>FOR TIME OUT</h3>
      <div class="form-row"><label>Date</label><input type="date" id="dateOut"></div>
      <button class="btn btn-gold" id="genOutBtn">CREATE QR CODE</button>
      <div id="qrOut" style="margin-top:16px;"></div>
    </div>

    <a href="attendance-records.html" class="btn btn-outline" style="background:var(--dark-green);color:#fff;">View Attendance Records</a>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
Session.requireRole("admin", "login.html");
document.getElementById("logoutLink").addEventListener("click", () => { Session.clear(); location.href="login.html"; });

async function makeQr(dateInputId, type, targetId) {
  const date = document.getElementById(dateInputId).value;
  if (!date) return alert("Pick a date first.");
  const { token } = await API.createTrainingDay(date, type); // token is what students scan
  const target = document.getElementById(targetId);
  target.innerHTML = "";
  new QRCode(target, { text: token, width: 200, height: 200 });
}
document.getElementById("genInBtn").addEventListener("click", () => makeQr("dateIn", "TimeIn", "qrIn"));
document.getElementById("genOutBtn").addEventListener("click", () => makeQr("dateOut", "TimeOut", "qrOut"));
</script>
</body>
</html>
