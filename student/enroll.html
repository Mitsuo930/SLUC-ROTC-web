<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enroll - SLUC ROTCU</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="center-page">

<div class="form-card">
  <img src="../assets/images/logo.png" alt="ROTC seal" class="brand-logo">
  <h2 style="text-align:center;">Enroll as a Cadet</h2>
  <form id="enrollForm">
    <div class="form-row"><label>Email</label><input type="email" id="email" required></div>
    <div class="form-row"><label>Password</label><input type="password" id="password" required></div>
    <div class="form-row"><label>Student ID</label><input type="text" id="studentId" required></div>
    <div class="form-row"><label>Name</label><input type="text" id="name" required></div>
    <div class="form-row"><label>Course</label><input type="text" id="course" required></div>
    <div class="form-row"><label>Address</label><input type="text" id="address" required></div>
    <div class="form-row"><label>Beneficiary</label><input type="text" id="beneficiary"></div>
    <div class="form-row"><label>CP#</label><input type="text" id="cp"></div>
    <div style="text-align:center;">
      <button type="submit" class="btn btn-gold">ENROLL</button>
    </div>
    <p id="msg" class="msg-box"></p>
  </form>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
document.getElementById("enrollForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const student = {
    email: email.value, password: password.value, id: studentId.value,
    name: name.value, course: course.value, address: address.value,
    beneficiary: beneficiary.value, cp: cp.value, status: "Pending"
  };
  try {
    await API.enrollStudent(student);
    msg.textContent = "Enrolled! Wait for your account to be approved by the admin.";
    msg.className = "msg-box msg-ok";
    e.target.reset();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "msg-box msg-error";
  }
});
</script>
</body>
</html>
